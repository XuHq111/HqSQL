<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HqSQL - 智能数据查询</title>
<link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f3f4f6; height:100vh; display:flex; flex-direction:column; }
  .header { background:#4f46e5; color:#fff; padding:12px 20px; font-size:18px; font-weight:600; }
  #chat-area { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; }
  .msg.user { align-self:flex-end; background:#4f46e5; color:#fff; border-radius:12px 12px 0 12px; }
  .msg.system { align-self:flex-start; background:#fff; border:1px solid #e5e7eb; border-radius:12px 12px 12px 0; width:100%; max-width:85%; }
  .msg.progress { align-self:flex-start; background:#f0f0ff; border-left:3px solid #818cf8; border-radius:4px; padding:8px 12px; font-size:13px; color:#4f46e5; }
  .msg.clarify { align-self:flex-start; background:#fff; border:1px solid #fbbf24; border-radius:12px 12px 12px 0; width:fit-content; min-width:300px; max-width:85%; }
  .msg.error { align-self:flex-start; background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
  .sql-block { background:#1e1e1e; color:#d4d4d4; padding:10px 12px; border-radius:6px; font-family:monospace; font-size:12px; overflow-x:auto; margin-top:8px; white-space:pre-wrap; }
  .result-section { margin-top:12px; }
  .result-header { font-weight:600; font-size:13px; color:#6b7280; margin-bottom:6px; }
  .input-area { padding:12px 20px; background:#fff; border-top:1px solid #e5e7eb; display:flex; gap:10px; align-items:center; }
  .input-area input { flex:1; padding:10px 14px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; outline:none; }
  .input-area input:focus { border-color:#4f46e5; }
  .input-area button { background:#4f46e5; color:#fff; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-size:14px; }
  .input-area button:hover { background:#4338ca; }
  .input-area button:disabled { background:#9ca3af; cursor:not-allowed; }
  .tabulator { font-size:13px; }
  .clarify-form { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .clarify-form input { padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
  .clarify-form button { align-self:flex-end; background:#f59e0b; color:#fff; border:none; padding:6px 16px; border-radius:6px; cursor:pointer; }
  .tip { font-size:11px; color:#9ca3af; margin-left:8px; }
  .msg.thinking { align-self:flex-start; background:#f5f5ff; border:1px solid #c7d2fe; border-radius:12px 12px 12px 0; width:fit-content; min-width:300px; max-width:85%; }
  .t-head { font-size:12px; color:#6366f1; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .t-spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .t-body { font-size:12px; color:#4b5563; font-family:monospace; white-space:pre-wrap; max-height:180px; overflow-y:auto; line-height:1.5; }
  .p-timer { color:#818cf8; font-weight:600; margin-left:8px; }
</style>
</head>
<body>
<div class="header">HqSQL · 智能数据查询</div>
<div id="chat-area"></div>
<div class="input-area" id="input-area">
  <input type="text" id="query-input" placeholder="输入您的查询，例如：本月各部门的费用对比" autofocus>
  <button id="send-btn" onclick="sendMessage()">发送</button>
  <span class="tip">Enter 发送</span>
</div>
<input type="hidden" id="session-id" value="">
<input type="hidden" id="pending-clarify" value="">

<script>
let currentSessionId = "";
let eventSource = null;

function appendChat(html) {
  document.getElementById("chat-area").insertAdjacentHTML("beforeend", html);
  document.getElementById("chat-area").scrollTop = document.getElementById("chat-area").scrollHeight;
}

function appendUserMsg(text) {
  appendChat(`<div class="msg user">${escapeHtml(text)}</div>`);
}

function appendProgress(html, step) {
  // 同节点内更新最近一条进度消息；新节点则追加一条（保留各节点耗时）
  const area = document.getElementById("chat-area");
  const lastMsg = area.lastElementChild;
  if (lastMsg && lastMsg.classList.contains("msg") && lastMsg.classList.contains("progress")
      && lastMsg.dataset.step === step) {
    lastMsg.innerHTML = html + '<span class="p-timer"></span>';
  } else {
    appendChat(`<div class="msg progress" data-step="${escapeHtml(step || "")}">${html}<span class="p-timer"></span></div>`);
  }
  area.scrollTop = area.scrollHeight;
}

// 节点耗时计时器：progress 到达时重置，每秒更新显示
let progressTimerId = null;
let progressStartTs = 0;
function armProgressTimer() {
  progressStartTs = Date.now();
  if (progressTimerId) clearInterval(progressTimerId);
  progressTimerId = setInterval(() => {
    const el = document.querySelector("#chat-area .msg.progress:last-child .p-timer");
    if (el) el.textContent = "⏱ " + Math.round((Date.now() - progressStartTs) / 1000) + "s";
  }, 1000);
}
function stopProgressTimer() {
  if (progressTimerId) { clearInterval(progressTimerId); progressTimerId = null; }
  // 停止时补写一次最终耗时（避免节点在1秒内结束导致计时器空白）
  const el = document.querySelector("#chat-area .msg.progress:last-child .p-timer");
  if (el && !el.textContent) {
    el.textContent = "⏱ " + Math.round((Date.now() - progressStartTs) / 1000) + "s";
  }
}

// LLM 思维链实时展示
const thinkingState = { node: "", el: null };
function handleThinking(node, delta) {
  const area = document.getElementById("chat-area");
  if (thinkingState.el && thinkingState.node !== node) {
    closeThinking(true);
  }
  if (!thinkingState.el) {
    appendChat(`<div class="msg thinking">
      <div class="t-head">🧠 ${escapeHtml(node)} 思考中 <span class="t-spin">⠋</span></div>
      <div class="t-body"></div>
    </div>`);
    const card = area.querySelector(".msg.thinking:last-child");
    thinkingState.el = card.querySelector(".t-body");
    thinkingState.node = node;
  }
  thinkingState.el.textContent += delta;
  area.scrollTop = area.scrollHeight;
}
function closeThinking(finished) {
  if (!thinkingState.el) return;
  const card = thinkingState.el.closest(".msg.thinking");
  if (finished) {
    const head = card.querySelector(".t-head");
    const len = card.querySelector(".t-body").textContent.length;
    head.innerHTML = `✅ ${escapeHtml(thinkingState.node)} 思考完成${len ? ` · ${len} 字` : ""}`;
    thinkingState.el.classList.add("t-done");
  }
  thinkingState.el = null;
  thinkingState.node = "";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function connectSSE(sessionId) {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/chat/stream?session_id=${sessionId}`);

  let lastProgressStep = "";

  eventSource.addEventListener("progress", (e) => {
    let data;
    try {
      data = JSON.parse(e.data);
    } catch(ex) {
      console.error("Failed to parse progress event data:", ex);
      document.getElementById("send-btn").disabled = false;
      document.getElementById("query-input").disabled = false;
      return;
    }
    const step = data.step || "";
    if (step !== lastProgressStep) {
      lastProgressStep = step;
      closeThinking(true);   // 进入新节点，收尾上一节点的思考卡
    }
    appendProgress(`📋 ${escapeHtml(data.detail)}`, step);
    armProgressTimer();      // 每次进度刷新都重置计时（同一节点多轮也重新计）
  });

  // LLM 思维链实时推送（reasoning_content 增量）
  eventSource.addEventListener("thinking", (e) => {
    let data;
    try {
      data = JSON.parse(e.data);
    } catch(ex) {
      return;
    }
    if (data.node && data.delta) {
      handleThinking(data.node, data.delta);
    }
  });

  eventSource.addEventListener("clarify", (e) => {
    let data;
    try {
      data = JSON.parse(e.data);
    } catch(ex) {
      console.error("Failed to parse clarify event data:", ex);
      document.getElementById("send-btn").disabled = false;
      document.getElementById("query-input").disabled = false;
      return;
    }
    closeThinking(true);
    stopProgressTimer();
    document.getElementById("pending-clarify").value = "1";
    const questionsHtml = data.questions.map((q, i) =>
      `<div>${i+1}. ${escapeHtml(q)}</div>`
    ).join("");
    appendChat(`
      <div class="msg clarify">
        <div style="font-weight:600;font-size:12px;color:#92400e;margin-bottom:6px;">🤔 帮您确认几个信息：</div>
        <div style="font-size:13px;margin-bottom:8px;">${questionsHtml}</div>
        <div style="font-size:11px;color:#9ca3af;margin-bottom:6px;">当前理解：${escapeHtml(data.enhanced_query)}</div>
        <div class="clarify-form">
          <input type="text" class="clarify-input" placeholder="在此输入补充说明，或留空回车确认">
          <button onclick="submitClarify(this)">确认</button>
        </div>
      </div>
    `);
    const clarifyInputs = document.querySelectorAll(".clarify-input");
    clarifyInputs[clarifyInputs.length - 1]?.focus();
  });

  eventSource.addEventListener("result", (e) => {
    let data;
    try {
      data = JSON.parse(e.data);
    } catch(ex) {
      console.error("Failed to parse result event data:", ex);
      document.getElementById("send-btn").disabled = false;
      document.getElementById("query-input").disabled = false;
      eventSource.close();
      return;
    }
    let html = '<div class="msg system">';

    if (data.sql) {
      html += `<div style="font-weight:600;font-size:12px;color:#6b7280;margin-bottom:4px;">生成的 SQL</div>`;
      html += `<div class="sql-block">${escapeHtml(data.sql)}</div>`;
    }

    if (data.columns && data.columns.length > 0) {
      const tableId = "result-table-" + Date.now();
      html += `<div class="result-section">`;
      html += `<div class="result-header">查询结果 <span style="color:#10b981;font-weight:normal">（${data.row_count} 行，${data.total_time}s）</span></div>`;
      html += `<div id="${tableId}" class="tabulator"></div>`;
      html += `</div>`;
      appendChat(html);

      const tableData = data.rows.map(row => {
        const obj = {};
        data.columns.forEach((col, i) => { obj[col] = row[i] || ""; });
        return obj;
      });
      new Tabulator(`#${tableId}`, {
        data: tableData,
        layout: "fitColumns",
        pagination: "local",
        paginationSize: 15,
        columns: data.columns.map(col => ({ title: col, field: col, headerFilter: true })),
      });
    } else {
      if (data.row_count === 0) {
        html += `<div style="margin-top:8px;color:#9ca3af;">查询结果为空</div>`;
      }
      appendChat(html);
    }

    document.getElementById("send-btn").disabled = false;
    document.getElementById("query-input").disabled = false;
    document.getElementById("pending-clarify").value = "";
    closeThinking(true);
    stopProgressTimer();
    eventSource.close();
  });

  eventSource.addEventListener("error", (e) => {
    let detail = "未知错误";
    let sql = "";
    try {
      const data = JSON.parse(e.data);
      detail = data.detail || detail;
      sql = data.sql || "";
    } catch(ex) {}

    let html = `<div class="msg error">`;
    html += `<div style="font-weight:600;">⚠ 执行出错</div>`;
    html += `<div style="margin-top:4px;">${escapeHtml(detail)}</div>`;
    if (sql) {
      html += `<div style="font-weight:600;font-size:12px;color:#6b7280;margin:8px 0 4px;">最后生成的 SQL</div>`;
      html += `<div class="sql-block">${escapeHtml(sql)}</div>`;
    }
    html += `</div>`;
    appendChat(html);
    document.getElementById("send-btn").disabled = false;
    document.getElementById("query-input").disabled = false;
    document.getElementById("pending-clarify").value = "";
    closeThinking(true);
    stopProgressTimer();
    eventSource.close();
  });

  eventSource.onerror = () => {
    console.log("SSE connection closed");
  };
}

async function sendMessage(messageText) {
  const input = document.getElementById("query-input");
  const text = messageText || input.value.trim();
  if (!text) return;

  const resp = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      session_id: currentSessionId,
      message: text,
      clarify_response: "",
    }),
  });
  const result = await resp.json();
  currentSessionId = result.session_id;
  document.getElementById("session-id").value = currentSessionId;

  appendUserMsg(text);
  input.value = "";
  document.getElementById("send-btn").disabled = true;
  input.disabled = true;

  connectSSE(currentSessionId);
}

async function submitClarify(btnEl) {
  // 定位当前澄清卡片：按钮点击从触发元素向上找所在卡片；回车提交取最后一张（最新出现的）
  const cards = document.querySelectorAll(".msg.clarify");
  const card = btnEl ? btnEl.closest(".msg.clarify") : (cards[cards.length - 1] ?? null);
  if (!card) return;

  const input = card.querySelector(".clarify-input");
  const reply = input ? input.value.trim() : "";

  await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      session_id: currentSessionId,
      message: "",
      clarify_response: reply,
    }),
  });

  card.innerHTML = `<div style="font-size:13px;color:#166534;">✅ 已提交${reply ? '：' + escapeHtml(reply) : '确认'}</div>`;
  card.style.border = "1px solid #86efac";
  card.style.background = "#f0fdf4";
  // 已提交的卡片不再参与澄清定位，避免后续提交误伤旧卡片
  card.classList.remove("clarify");
  document.getElementById("pending-clarify").value = "";
}

// 回车发送
document.getElementById("query-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

// 回车提交澄清
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("pending-clarify").value === "1") {
    e.preventDefault();
    submitClarify();
  }
});
</script>
</body>
</html>
